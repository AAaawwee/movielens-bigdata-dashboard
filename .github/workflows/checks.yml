name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python -m compileall -q dashboard pipeline/als
      - name: Validate Flask route registration
        run: |
          PYTHONPATH=dashboard python - <<'PY'
          from app import create_app
          app = create_app()
          assert app.test_client().get("/").status_code == 200
          assert len([rule for rule in app.url_map.iter_rules() if rule.rule.startswith("/api/")]) == 8
          PY
      - run: node --check dashboard/static/dashboard.js && node --check verification/verify_browser.cjs
      - run: find pipeline scripts verification -name '*.sh' -exec bash -n {} \;
